services:
  - type: web
    name: trokiva-preview
    runtime: static
    buildCommand: echo "TROKIVA preview ready"
    staticPublishPath: .
    autoDeployTrigger: 'off'
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
