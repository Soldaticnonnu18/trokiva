<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><title>TROKIVA — Nouveau mot de passe</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#124e46;background:#f8f7f2}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center}main{width:min(440px,calc(100% - 32px));background:#fff;padding:27px;border:1px solid #e6e9e1;border-radius:22px;box-shadow:0 8px 28px #124e460d}h1{font-size:27px;margin:0 0 14px;letter-spacing:-.6px}p{line-height:1.5}label{display:grid;gap:8px;font-weight:650}input{width:100%;padding:14px;border:1px solid #cfd9cb;border-radius:12px;margin-bottom:15px}button{cursor:pointer;border:0;border-radius:22px;background:#124e46;color:#fff;font:inherit;font-weight:750;padding:13px 18px;width:100%}button:disabled{opacity:.55}a{color:#124e46}#status{min-height:23px}
</style></head><body><main><h1>Nouveau mot de passe</h1><p>Choisissez un mot de passe d’au moins 12 caractères.</p>
<form id="form"><label for="password">Nouveau mot de passe<input id="password" type="password" minlength="12" maxlength="128" autocomplete="new-password" required></label><button id="submit">Modifier mon mot de passe</button></form>
<p id="status" role="status" aria-live="polite"></p><a href="/">Retour à TROKIVA</a></main>
<script>
(()=>{
const token=new URLSearchParams(location.hash.slice(1)).get('token');
history.replaceState(null,'',location.pathname);
const form=document.getElementById('form'),status=document.getElementById('status'),submit=document.getElementById('submit');
if(!token || !/^[a-f0-9]{64}$/.test(token)){form.hidden=true;status.textContent='Lien invalide ou incomplet.';return}
form.addEventListener('submit',async e=>{
 e.preventDefault();const password=document.getElementById('password').value;
 if(password.length<12){status.textContent='Utilisez au moins 12 caractères.';return}
 submit.disabled=true;status.textContent='Vérification du lien…';
 try{
  const response=await fetch('/api/auth/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password})});
  const data=await response.json();
  status.textContent=response.ok?'Mot de passe modifié. Vous pouvez retourner à TROKIVA.':(data.error||'Réinitialisation indisponible.');
  if(response.ok){form.reset();form.hidden=true}
 }catch{status.textContent='Connexion indisponible. Réessayez.'}
 finally{submit.disabled=false}
});
})();
</script></body></html>
