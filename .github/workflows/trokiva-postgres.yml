name: TROKIVA PostgreSQL réel isolé
on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/trokiva-postgres.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: trokiva_test
          POSTGRES_PASSWORD: ci_only_secret
          POSTGRES_DB: trokiva_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trokiva_test -d trokiva_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Installer les dépendances et contrôler le code
        run: npm ci --omit=dev
      - name: Tester les transactions sur PostgreSQL 17 jetable
        env:
          TROKIVA_TEST_DATABASE_URL: postgres://trokiva_test:ci_only_secret@127.0.0.1:5432/trokiva_test
        run: npm test
