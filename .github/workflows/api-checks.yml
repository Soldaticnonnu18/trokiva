name: TROKIVA API checks

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'verify.html'
      - '.github/workflows/api-checks.yml'
  pull_request:
    paths:
      - 'api/**'
      - 'verify.html'
      - '.github/workflows/api-checks.yml'

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Syntax check
        run: npm run check
      - name: Offline smoke tests (no database credentials)
        run: npm test
