<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><title>TROKIVA — Vérification de l’adresse e-mail</title><style>body{font:16px system-ui,sans-serif;background:#f8f7f2;color:#124e46;margin:0;display:grid;min-height:100vh;place-items:center}main{background:white;border-radius:22px;padding:32px;max-width:500px;margin:18px;box-shadow:0 3px 20px #124e4612}a{color:#124e46}</style></head><body><main><h1>Vérification TROKIVA</h1><p id="state">Vérification en cours…</p><p><a href="/">Retour à TROKIVA</a></p></main><script>
(async()=>{const msg=document.getElementById('state');const token=new URLSearchParams(location.hash.slice(1)).get('token');history.replaceState(null,'',location.pathname);if(!token||!/^[a-f0-9]{64}$/.test(token)){msg.textContent='Lien invalide.';return}try{const res=await fetch('/api/auth/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})});const body=await res.json();msg.textContent=res.ok?'Adresse e-mail vérifiée. Votre compte est maintenant activé.':(body.error||'Lien expiré ou invalide.')}catch{msg.textContent='Connexion indisponible. Veuillez réessayer.'}})();
</script></body></html>
